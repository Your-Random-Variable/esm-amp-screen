name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autodock-vina openbabel python3-openbabel

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        pip install -e .

    - name: Run 18-Point Physical & Logical Regression Suite
      run: |
        python test_all_18_bugs.py

    - name: Run Lead Optimizer & Mutation Scan Unit Tests
      run: |
        python test_lead_optimizer.py

    - name: Run Standardized Benchmark Validation Suite
      run: |
        python run_benchmarks.py

    - name: Run Automated Unittest Suite
      run: |
        python -m unittest discover -s tests

    - name: Run Pytest Suite
      run: |
        pytest -q -k "not end_to_end"
