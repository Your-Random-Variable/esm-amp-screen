[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esm_amp_screen"
version = "1.3.0"
description = "High-Throughput ESM-Powered Protein-Peptide Virtual Screening, Physics Engine, & In Silico Lead Optimizer"
readme = "README.md"
authors = [{ name = "Antigravity Computational Science Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "gemmi>=0.6.5",
    "rdkit>=2023.09.1",
    "scikit-learn>=1.3.0",
    "biopython>=1.81",
    "PeptideBuilder>=0.1.1",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.30.0"
]

[project.optional-dependencies]
relaxation = [
    "openbabel-wheel>=3.1.1.20"
]
all = [
    "openbabel-wheel>=3.1.1.20"
]

[project.scripts]
esm-amp-screen = "esm_amp_screen.cli:main"
